{% extends "base.html" %}
{% block title %}Foros{% endblock %}
{% block customCSS %}
  <link href="/static/css/foros.css" rel="stylesheet">
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-end mb-3">
    <button type="button" class="btn btn-primary"
            data-bs-toggle="modal" data-bs-target="#editModal"
            hx-get="/ui/foros/form?modo=crear"
            hx-target="#modal-content" hx-swap="innerHTML">Agregar</button>
  </div>
  <div id="cards" hx-get="/ui/foros/cards" hx-trigger="load, refrescarLista from:body" hx-swap="innerHTML"></div>

  <!-- Modal genérico -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>
  <script>
    document.body.addEventListener('modalClose', function(){
      var el = document.getElementById('editModal');
      if (!el) return;
      try { var inst = window.bootstrap.Modal.getOrCreateInstance(el); if (inst) inst.hide(); } catch(e){}
    });
  </script>
{% endblock %}
