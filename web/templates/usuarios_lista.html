{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<h2 class="mb-4">Usuarios</h2>

<div class="row mb-3">
    <div class="col-sm-6">
        <input class="form-control" type="search" name="q" placeholder="Buscar por nombre o usuario..."
            hx-get="/ui/usuarios/filas" hx-trigger="keyup changed delay:300ms, search" hx-target="#tbody-lista">
    </div>
    <div class="col-sm-6 text-end">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editModal"
            hx-get="/ui/usuarios/form?modo=crear" hx-target="#modal-content" hx-swap="innerHTML">
            ✨ Nuevo Usuario
        </button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-sm align-middle">
        <thead class="table-light">
            <tr>
                <th>Usuario / Nombres</th>
                <th>Rol / Área</th>
                <th>Correo</th>
                <th style="width:150px;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-lista" hx-get="/ui/usuarios/filas" hx-trigger="load" hx-swap="innerHTML">
            <tr>
                <td colspan="4" class="text-center py-4 text-muted">Cargando usuarios...</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modal-content"></div>
    </div>
</div>
{% endblock %}
