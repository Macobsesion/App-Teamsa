{% extends "base.html" %}
{% block title %}Proveedores{% endblock %}

{% block content %}
<h2 class="mb-4">Proveedores</h2>

<!-- Buscador y Acciones -->
<div class="row mb-3">
    <div class="col-sm-6">
        <input class="form-control" type="search" name="q" placeholder="Buscar por nombre..."
            hx-get="/ui/proveedores/filas" hx-trigger="keyup changed delay:300ms, search" hx-target="#tbody-lista">
    </div>
    <div class="col-sm-6 text-end">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editModal"
            hx-get="/ui/proveedores/form?modo=crear" hx-target="#modal-content" hx-swap="innerHTML">
            ✨ Nuevo Proveedor
        </button>
    </div>
</div>

<!-- Tabla Explícita (KISS) -->
<div class="table-responsive">
    <table class="table table-striped table-sm align-middle">
        <thead class="table-light">
            <tr>
                <th>Nombre / Razón Social</th>
                <th>RFC</th>
                <th>Contacto</th>
                <th>Categoría</th>
                <th class="text-center">Estado</th>
                <th style="width:150px;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-lista" hx-get="/ui/proveedores/filas" hx-trigger="load" hx-swap="innerHTML">
            <tr>
                <td colspan="6" class="text-center py-4 text-muted">Cargando proveedores...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal Genérico -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modal-content"></div>
    </div>
</div>
{% endblock %}
