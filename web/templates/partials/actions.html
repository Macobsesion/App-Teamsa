{% macro acciones(ui_base, id, puede_editar=True, extras=None, delete_confirm='¿Eliminar?') %}
{% if puede_editar %}
<td>
  <div class="btn-group btn-group-sm">
    {% if extras %}
    {% for ex in extras %}
    <button class="btn btn-sm btn-secondary" data-bs-toggle="modal" data-bs-target="#editModal" hx-get="{{ ex.hx_get }}"
      hx-target="#modal-content" hx-swap="innerHTML">{{ ex.label }}</button>
    {% endfor %}
    {% endif %}
    <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal"
      hx-get="{{ ui_base }}/form?id={{ id }}&modo=editar" hx-target="#modal-content" hx-swap="innerHTML"
      title="Editar">✏️</button>
    <button class="btn btn-sm btn-outline-danger" hx-delete="{{ ui_base }}/{{ id }}" hx-target="closest tr"
      hx-swap="delete" hx-confirm="{{ delete_confirm }}" title="Eliminar">🗑️</button>
  </div>
</td>
{% endif %}
{% endmacro %}
