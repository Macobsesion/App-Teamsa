{# web/templates/ui/macros/alertas.html #}

{% macro contenedor_toasts() %}
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
        <div id="errorToast" class="toast border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" 
             style="border-radius: 15px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(5px);">
            <div class="toast-header border-0 bg-transparent text-danger pt-3 px-3">
                <span class="fs-5 me-2">🚫</span>
                <strong class="me-auto">Error detectado</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
            <div class="toast-body pb-4 px-3 text-secondary" id="errorToastBody">
                <!-- Mensaje inyectado -->
            </div>
            <div class="progress" style="height: 3px; border-radius: 0 0 15px 15px;">
                <div class="progress-bar bg-danger" role="progressbar" style="width: 100%; transition: width 10s linear;"></div>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
