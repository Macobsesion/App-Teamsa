{% import "ui/macros/botones.html" as btn %}

<div class="modal-header bg-light">
  <h5 class="modal-title">🔐 Cambiar Contraseña</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>
<div class="modal-body">
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <div class="alert alert-warning py-2 mb-3 shadow-sm">
    ⚠️ Esta acción cambiará la contraseña de acceso al sistema para este usuario.
  </div>

  <form id="frmPassword"
        hx-post="/api/usuarios/{{ item_id }}/password"
        hx-target="#modal-content"
        hx-swap="innerHTML"
        hx-encoding="application/x-www-form-urlencoded">

    <div class="mb-3">
      <label class="form-label">Nueva Contraseña</label>
      <input class="form-control" name="contrasena" type="password" required autocomplete="new-password">
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar Contraseña</label>
      <input class="form-control" name="confirmarContrasena" type="password" required autocomplete="new-password">
    </div>

    <div class="modal-footer bg-light">
      {{ btn.btn_secundario("Cancelar") }}
      {{ btn.btn_primario("Guardar", type="submit") }}
    </div>
  </form>
</div>

<script>
  setTimeout(() => {
    var form = document.getElementById('frmPassword');
    if (!form) return;
    var p = form.querySelector('input[name="contrasena"]');
    var c = form.querySelector('input[name="confirmarContrasena"]');
    var btn = form.querySelector('button[type="submit"]');
    function validate() {
      var pv = p.value || '';
      var cv = c.value || '';
      var match = (pv === cv) && (pv !== '');
      p.classList.toggle('is-invalid', pv === '');
      c.classList.toggle('is-invalid', !match && cv !== '');
      c.classList.toggle('is-valid', match);
      btn.disabled = !match;
    }
    p.addEventListener('input', validate);
    c.addEventListener('input', validate);
    validate();
  }, 50);
</script>
