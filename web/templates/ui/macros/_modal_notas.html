{# web/templates/ui/macros/_modal_notas.html #}
{# Macro para el modal genérico de notas privadas/internas #}

{% macro modal_notas_privadas() %}
<div class="modal fade" id="modalNotasPrivadas" tabindex="-1" aria-labelledby="modalNotasPrivadasLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header modal-header-teamsa">
        <h5 class="modal-title" id="notasPrivadasTitulo">🔒 Notas Internas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="notasPrivadasModulo">
        <input type="hidden" id="notasPrivadasId">
        
        <div class="mb-3">
          <label class="form-label calc-label fw-bold">Escribe tus notas aquí:</label>
          <textarea class="form-control" id="notasPrivadasTexto" rows="8" 
            placeholder="Estas notas son SÓLO para administración y NO aparecen en el PDF."></textarea>
          <div class="form-text text-muted text-2xs mt-2">
            <i class="fas fa-info-circle me-1"></i> El contenido se guarda de forma segura en el servidor.
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teamsa-primary px-4" onclick="window.TEAMSA.Notas.guardar()" style="border-radius: 8px;">
            <i class="fas fa-save me-2"></i>Guardar Notas
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endmacro %}
