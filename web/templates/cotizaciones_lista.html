{% extends "base.html" %}
{% block title %}Cotizaciones{% endblock %}

{% block content %}
<h2 class="mb-4">Cotizaciones</h2>

<!-- Buscador y Acciones -->
<div class="row mb-3">
    <div class="col-sm-6">
        <input class="form-control" type="search" name="q" placeholder="Buscar por número..."
            hx-get="/ui/cotizaciones/filas" hx-trigger="keyup changed delay:300ms, search" hx-target="#tbody-lista">
    </div>
    <div class="col-sm-6 text-end">
        <a href="/ui/cotizaciones/wizard" class="btn btn-primary">✨ Nueva Cotización</a>
    </div>
</div>

<!-- Tabla Explícita (KISS) -->
<div class="table-responsive">
    <table class="table table-striped table-sm align-middle">
        <thead class="table-light">
            <tr>
                <th>Número</th>
                <th>Cliente</th>
                <th>Fecha Emisión</th>
                <th class="text-end">Total</th>
                <th>Estado</th>
                <th style="width:150px;">Acciones</th>
            </tr>
        </thead>
        <!-- HTMX carga las filas aquí -->
        <tbody id="tbody-lista" hx-get="/ui/cotizaciones/filas" hx-trigger="load" hx-swap="innerHTML">
            <tr>
                <td colspan="6" class="text-center py-4 text-muted">Abonando cotizaciones...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal Genérico para HTMX (aunque Cotizaciones usa Wizard, lo mantenemos por consistencia) -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modal-content"></div>
    </div>
</div>

<!-- Modal Notas Privadas -->
<div class="modal fade" id="modalNotasPrivadas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalNotasPrivadasTitulo">📝 Notas Privadas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info alert-sm">
                    <small>ℹ️ Solo uso interno. No visible en PDF.</small>
                </div>
                <textarea class="form-control" id="notasPrivadasTexto" rows="5"
                    placeholder="Escribe aquí..."></textarea>
                <input type="hidden" id="notasPrivadasCotizacionId">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarNotasPrivadas()">💾 Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Script Notas Privadas (Refactorizado con Fetch)
    function abrirNotasPrivadas(id, num) {
        document.getElementById('modalNotasPrivadasTitulo').textContent = `📝 Notas - ${num}`;
        document.getElementById('notasPrivadasTexto').value = 'Cargando...';
        document.getElementById('notasPrivadasCotizacionId').value = id;

        new bootstrap.Modal('#modalNotasPrivadas').show();

        // Cargar nota fresca desde API
        fetch(`/api/cotizaciones/${id}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('notasPrivadasTexto').value = data.notas_privadas || '';
            })
            .catch(err => {
                document.getElementById('notasPrivadasTexto').value = 'Error al cargar notas.';
                console.error(err);
            });
    }

    document.addEventListener('click', e => {
        const btn = e.target.closest('.btn-notas-privadas');
        if (btn) {
            abrirNotasPrivadas(
                btn.dataset.cotizacionId,
                btn.dataset.numero
            );
        }
    });

    function guardarNotasPrivadas() {
        const id = document.getElementById('notasPrivadasCotizacionId').value;
        const notas = document.getElementById('notasPrivadasTexto').value;

        fetch(`/api/cotizaciones/${id}/notas-privadas`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notas_privadas: notas })
        }).then(res => {
            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('modalNotasPrivadas')).hide();
                htmx.trigger('#tbody-lista', 'load'); // Refrescar tabla
            } else {
                alert('Error al guardar');
            }
        });
    }
</script>
{% endblock %}
