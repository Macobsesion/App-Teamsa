<!--
Formulario de Login.
  Envia credenciales a /auth/validaUsuario y muestra mensajes de resultado.-->

{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block customCSS %}{% endblock %}

{% block content %}
<form id="formLogin" class="mx-auto" style="max-width: 400px;">
  <div class="mb-3">
    <label class="form-label">Usuario</label>
    <input type="text" name="txtNombre" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Contraseña</label>
    <input type="password" name="txtPassword" class="form-control" required>
  </div>
  <div class="d-flex justify-content-center mt-3">
    <button class="btn btn-teamsa-primary">Iniciar sesión</button>
  </div>
</form>
{% endblock %}

{% block customJS %}
<script src="/static/js/autenticacion.js"></script>
{% endblock %}
